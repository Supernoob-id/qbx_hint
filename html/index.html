<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Far: marker template (one clone per point) -->
    <template id="markerTpl">
        <div class="marker">
            <div class="marker-bob">
                <div class="marker-pin"></div>
                <div class="marker-tip"></div>
            </div>
            <div class="marker-dist"></div>
        </div>
    </template>

    <!-- Near: info panel (single, owned by the closest point) -->
    <div id="hint" class="hint">
        <div class="hint-icon" id="hintIcon"></div>
        <div class="hint-body">
            <div class="hint-title" id="title"></div>
            <div class="hint-text">
                <span id="text"></span>
                <span class="hint-key" id="key"></span>
                <span id="subtext"></span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
